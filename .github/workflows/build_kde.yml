# Requirements: package KDE Plasma X11 from the Server Artifact in this same Run.
# Unknowns: no proven 2101W DTB or hardware boot support; current input is dynamic.
# Risks: seven-day artifact retention, upstream drift, guest filesystem corruption.
# Verification: server metadata SHA-256, actual ARM64 packages, offline ext4 fsck,
# gzip integrity, manifest, non-release Artifact. Never write factory eMMC.
name: Build Armbian 2101W KDE Plasma (reusable, non-release)

on:
  workflow_call:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  kde:
    name: Install KDE Plasma X11 and verify ext4
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout KDE build script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check ARM64 tooling
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bash -n scripts/build_kde_image.sh
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            util-linux parted e2fsprogs pigz gzip python3
          df -h /

      - name: Download Server artifact from the current Run
        uses: actions/download-artifact@v4
        with:
          name: armbian-2101w-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/kde-base

      - name: Verify exact Server input and metadata
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/kde-base" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          base = Path(sys.argv[1])
          meta = json.loads((base / "server-metadata.json").read_text())
          assert meta["run_id"] == int(os.environ["GITHUB_RUN_ID"])
          assert meta["commit"] == os.environ["GITHUB_SHA"]
          assert meta["board"] == "s905x3-2101"
          assert meta["os"] == "Debian Bookworm ARM64"
          assert meta["hardware_boot_validated"] is False
          name = meta["image"]
          assert name == Path(name).name
          match = re.fullmatch(
              r"Armbian_[^_]+_amlogic_s905x3-2101_bookworm_(\d+\.\d+\.\d+)_server_.+\.img\.gz",
              name,
          )
          assert match is not None and match.group(1) == meta["kernel"]
          image = base / name
          assert image.is_file() and image.stat().st_size == meta["bytes"]
          assert len(list(base.glob("*.img.gz"))) == 1
          digest = hashlib.sha256()
          with image.open("rb") as stream:
              for chunk in iter(lambda: stream.read(4 * 1024 * 1024), b""):
                  digest.update(chunk)
          assert digest.hexdigest() == meta["sha256"], "Server image SHA-256 mismatch"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"KDE_INPUT={image}\n")
              output.write(f"KDE_KERNEL={meta['kernel']}\n")
              output.write(f"KDE_SOURCE_SHA256={meta['sha256']}\n")
          print("Verified:", image.name, meta["sha256"])
          PY

      - name: Install KDE and validate ext4 inside the ARM64 image
        timeout-minutes: 190
        run: |
          set -euo pipefail
          sudo env RUNNER_TEMP="${RUNNER_TEMP}" SOURCE_COMMIT="${GITHUB_SHA}" \
            bash scripts/build_kde_image.sh \
              "${KDE_INPUT}" "${RUNNER_TEMP}/kde-output" \
              "${GITHUB_RUN_ID}" "${KDE_KERNEL}" "${KDE_SOURCE_SHA256}"

      - name: Confirm KDE candidate manifest before upload
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=( "${RUNNER_TEMP}/kde-output/"*kde-plasma_x11.img.gz )
          (( ${#images[@]} == 1 ))
          test "$(stat -c%s "${images[0]}")" -gt 300000000
          python3 - "${RUNNER_TEMP}/kde-output/kde-image-manifest.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          meta = json.loads(Path(sys.argv[1]).read_text())
          assert meta["source_run"] == int(os.environ["GITHUB_RUN_ID"])
          assert meta["source_commit"] == os.environ["GITHUB_SHA"]
          assert meta["kernel"] == os.environ["KDE_KERNEL"]
          assert meta["server_image_sha256"] == os.environ["KDE_SOURCE_SHA256"]
          assert "KDE Plasma X11" in meta["desktop"]
          assert meta["ext4_fsck_clean"] is True
          assert meta["hardware_boot_validated"] is False
          assert meta["emmc_written"] is False
          print("KDE image verified:", meta["desktop"], meta["kernel"])
          PY

      - name: Upload verified KDE image (no Release)
        uses: actions/upload-artifact@v4
        with:
          name: armbian-2101w-bookworm-kde-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kde-output/*.img.gz
            ${{ runner.temp }}/kde-output/kde-image-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Document scope
        run: |
          printf '%s\n' \
            '### 2101W KDE candidate' \
            "Source Server Run: ${GITHUB_RUN_ID}; kernel: ${KDE_KERNEL}." \
            'Real ARM64 KDE installation and detached read-only ext4 check required.' \
            '**Hardware boot, HDMI, JL2101, W522A, LED, eMMC not tested.**' \
            'Artifact retention: 7 days. No Release and no factory eMMC write.' \
            >> "${GITHUB_STEP_SUMMARY}"
