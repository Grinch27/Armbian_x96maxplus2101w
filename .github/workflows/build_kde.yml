# Requirements: deliver an actual Bookworm ARM64 Armbian KDE Plasma X11 image
# for X96 MAX+ 2101W S905X3, 4GiB RAM and 64GiB factory eMMC.
# Ambiguities: s905x3-2101 DTB and kernel 6.12.116 do not yet prove 2101W
# boot compatibility; HDMI, USB keyboard/mouse, JL2101, W522A are untested.
# Research: later replace upstream 2101 DTB with verified 2101W board mapping.
# Risks: source artifact expires, KDE apt mirror availability, disk usage and
# first-login SDDM account setup; never write to factory eMMC or modify U-Boot.
# Verification: actual KDE dpkg install in ARM64 image, SDDM graphical target,
# fsck, compressed image gzip test, temporary GitHub Actions Artifact only.
name: Build Armbian 2101W KDE Plasma (non-release)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_kde.yml'
      - 'scripts/build_kde_image.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: armbian-2101w-kde-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  kde:
    name: Build real KDE Plasma image from verified ARM64 base
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    env:
      SOURCE_RUN_ID: '42480891440'
      SOURCE_ARTIFACT: armbian-2101w-candidate-42480891440
      KDE_OUTPUT_DIR: ${{ runner.temp }}/kde-output
    steps:
      - name: Checkout KDE build script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax validation and runner prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          bash -n scripts/build_kde_image.sh
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            util-linux parted e2fsprogs pigz gzip python3
          df -h /
      - name: Download successful original 2101W server candidate
        uses: actions/download-artifact@v4
        with:
          name: armbian-2101w-candidate-42480891440
          run-id: 42480891440
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/kde-base
      - name: Verify the exact source image
        run: |
          set -euo pipefail
          mapfile -d '' images < <(find "${RUNNER_TEMP}/kde-base" -type f \
            -name 'Armbian_26.11.0_amlogic_s905x3-2101_bookworm_6.12.116_server_*.img.gz' -print0)
          if (( ${#images[@]} != 1 )); then
            echo "::error::Expected exactly one previously verified server image, got ${#images[@]}"
            exit 1
          fi
          gzip -t "${images[0]}"
          printf 'KDE_INPUT=%s\n' "${images[0]}" >> "${GITHUB_ENV}"
          printf 'Original upstream packaging Run: [#42480891440](https://github.com/%s/actions/runs/42480891440)\n' \
            "${GITHUB_REPOSITORY}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Build and validate KDE desktop inside the ARM64 image
        timeout-minutes: 190
        run: |
          set -euo pipefail
          sudo -E bash scripts/build_kde_image.sh \
            "${KDE_INPUT}" "${RUNNER_TEMP}/kde-output" 42480891440
      - name: Confirm KDE image and manifest before Artifact publication
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${RUNNER_TEMP}/kde-output/"*kde-plasma_x11.img.gz)
          (( ${#files[@]} == 1 ))
          test "$(stat -c %s "${files[0]}")" -gt 300000000
          gzip -t "${files[0]}"
          test -s "${RUNNER_TEMP}/kde-output/kde-image-manifest.json"
          python3 - "${RUNNER_TEMP}/kde-output/kde-image-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          meta = json.loads(Path(sys.argv[1]).read_text())
          assert meta["source_run"] == 42480891440
          assert meta["kernel"] == "6.12.116"
          assert "KDE Plasma X11" in meta["desktop"]
          assert meta["hardware_boot_validated"] is False
          assert meta["emmc_written"] is False
          print("Verified KDE image provenance:", meta["desktop"], meta["device"])
          PY
      - name: Upload KDE candidate image (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: armbian-2101w-bookworm-kde-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kde-output/*.img.gz
            ${{ runner.temp }}/kde-output/kde-image-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Document scope of completed build
        run: |
          printf '%s\n' \
            '### 2101W KDE Plasma ARM64 candidate' \
            'KDE packages installed directly into the Bookworm root filesystem.' \
            'SDDM set as graphical display manager (X11).' \
            'Original board mapping: ophub s905x3-2101; kernel 6.12.116.' \
            '**Offline image validation only. No HDMI, mouse, JL2101 or W522A hardware verification.**' \
            '**Do not run armbian-install or overwrite factory Android eMMC.**' \
            'Artifact retention: 7 days; no Release.' \
            >> "${GITHUB_STEP_SUMMARY}"
